name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  backend-unit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Unit tests and critical behavior coverage gate (server)
        working-directory: server
        run: mvn -B verify

      - name: Upload backend coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-unit-coverage
          path: server/**/target/site/jacoco/
          if-no-files-found: error

  backend-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Integration tests (server)
        working-directory: server
        run: mvn -B -Pit verify

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: web/package-lock.json

      - name: Install (web)
        working-directory: web
        run: npm ci

      - name: Test with coverage (web)
        working-directory: web
        run: npm run test:coverage

      - name: Build (web)
        working-directory: web
        run: npm run build

      - name: Upload frontend coverage
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: web/coverage/
          if-no-files-found: error

  java-21-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    continue-on-error: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Verify server compatibility
        working-directory: server
        run: mvn -B verify

  compose-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [backend-unit, frontend]
    env:
      SMOKE_PROJECT_NAME: linkforge-smoke-${{ github.run_id }}-${{ github.run_attempt }}
      JWT_SECRET: ci-smoke-jwt-secret-that-is-longer-than-thirty-two-bytes
      API_KEY_CURRENT_KEY_ID: ci-smoke-v1
      API_KEY_CURRENT_PEPPER: ci-smoke-api-key-pepper-that-is-independent-and-long
      API_KEY_LEGACY_JWT_FALLBACK_ENABLED: "false"
      ANALYTICS_SALT: ci-smoke-analytics-salt-that-is-not-a-production-secret
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and smoke actual Compose images
        run: bash deploy/smoke.sh
