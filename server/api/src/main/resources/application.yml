spring:
  application:
    name: linkforge-api
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/linkforge?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC}
    username: ${DB_USERNAME:linkforge}
    password: ${DB_PASSWORD:linkforge}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:20}

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  strict-config: ${APP_STRICT_CONFIG:false}
  cors:
    # 生产环境建议配置白名单，例如：http://localhost:5173,http://your-domain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # cookie 模式需要开启（允许携带凭证时必须使用明确白名单，禁止 "*"）
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  id:
    worker-id: ${ID_WORKER_ID:1}
    datacenter-id: ${ID_DATACENTER_ID:1}
  security:
    jwt:
      # 生产环境务必通过环境变量覆盖，并保证长度足够（>= 32 bytes）
      secret: ${JWT_SECRET:dev-change-me-please-set-env-and-long-enough-32-bytes}
      issuer: ${JWT_ISSUER:linkforge}
      ttl-seconds: ${JWT_TTL_SECONDS:43200} # 12h
      # 可选：HttpOnly Cookie 会话模式（默认关闭）
      cookie-enabled: ${JWT_COOKIE_ENABLED:false}
      cookie-name: ${JWT_COOKIE_NAME:lf_token}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}
  shortlink:
    code-length-min: 6
  redirect:
    cache-ttl-seconds: ${REDIRECT_CACHE_TTL_SECONDS:3600}
    default-status-code: ${REDIRECT_DEFAULT_STATUS_CODE:302} # 302 or 301
  analytics:
    salt: ${ANALYTICS_SALT:dev-salt-change-me}
    redis-key-ttl-days: ${ANALYTICS_REDIS_TTL_DAYS:45}
    # flush 回补窗口（最近 N 天，包含今天），用于部署中断后的追赶补齐
    flush-backfill-days: ${ANALYTICS_FLUSH_BACKFILL_DAYS:7}
    events:
      # 访问明细事件（Edge → Redis Stream → API 异步落库），默认关闭
      enabled: ${ANALYTICS_EVENTS_ENABLED:false}
      sample-rate: ${ANALYTICS_EVENTS_SAMPLE_RATE:0.1}
      retention-days: ${ANALYTICS_EVENTS_RETENTION_DAYS:14}
      # consumer 稳定化：多实例部署建议每个实例不同且稳定（可选）
      consumer-name: ${ANALYTICS_EVENTS_CONSUMER_NAME:}
      # pending 治理：接管闲置 pending（避免 consumer 漂移/下线导致长期积压）
      pending-reclaim-enabled: ${ANALYTICS_EVENTS_PENDING_RECLAIM_ENABLED:true}
      pending-reclaim-min-idle-ms: ${ANALYTICS_EVENTS_PENDING_RECLAIM_MIN_IDLE_MS:60000}
      pending-reclaim-count: ${ANALYTICS_EVENTS_PENDING_RECLAIM_COUNT:200}

logging:
  level:
    root: INFO
