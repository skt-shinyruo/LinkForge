spring:
  application:
    name: linkforge-server
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

  datasource:
    driver-class-name: org.apache.shardingsphere.driver.ShardingSphereDriver
    url: jdbc:shardingsphere:classpath:shardingsphere-readwrite.yaml?placeholder-type=environment

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

mybatis:
  configuration:
    map-underscore-to-camel-case: true

server:
  port: ${SERVER_PORT:8080}

management:
  server:
    address: ${MANAGEMENT_BIND_ADDRESS:127.0.0.1}
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

app:
  strict-config: ${APP_STRICT_CONFIG:false}
  cors:
    # 生产环境建议配置白名单，例如：http://localhost:5173,http://your-domain.com
    allowed-origins: ${CORS_ALLOWED_ORIGINS:}
    # cookie 模式需要开启（允许携带凭证时必须使用明确白名单，禁止 "*"）
    allow-credentials: ${CORS_ALLOW_CREDENTIALS:false}
  base-url: ${APP_BASE_URL:http://localhost:8080}
  id:
    worker-id: ${ID_WORKER_ID:1}
    datacenter-id: ${ID_DATACENTER_ID:1}
  security:
    registration-enabled: ${AUTH_REGISTRATION_ENABLED:false}
    jwt:
      # 生产环境务必通过环境变量覆盖，并保证长度足够（>= 32 bytes）
      secret: ${JWT_SECRET:dev-change-me-please-set-env-and-long-enough-32-bytes}
      issuer: ${JWT_ISSUER:linkforge}
      ttl-seconds: ${JWT_TTL_SECONDS:43200} # 12h
      # 可选：HttpOnly Cookie 会话模式（默认关闭）
      cookie-enabled: ${JWT_COOKIE_ENABLED:false}
      cookie-name: ${JWT_COOKIE_NAME:lf_token}
      cookie-secure: ${JWT_COOKIE_SECURE:false}
      cookie-same-site: ${JWT_COOKIE_SAMESITE:Lax}
    api-key:
      # 非生产默认允许回退 JWT secret；prod/strict 必须显式配置独立 current pepper 并关闭回退。
      current-key-id: ${API_KEY_CURRENT_KEY_ID:default}
      current-pepper: ${API_KEY_CURRENT_PEPPER:${API_KEY_HMAC_PEPPER:}}
      previous-key-id: ${API_KEY_PREVIOUS_KEY_ID:}
      previous-pepper: ${API_KEY_PREVIOUS_PEPPER:}
      legacy-pepper: ${API_KEY_LEGACY_PEPPER:${API_KEY_HMAC_PEPPER:}}
      legacy-jwt-fallback-enabled: ${API_KEY_LEGACY_JWT_FALLBACK_ENABLED:true}
      # 旧版配置名仅供无 key id 历史摘要迁移。
      hmac-pepper: ${API_KEY_HMAC_PEPPER:}
      last-used-update-interval-seconds: ${API_KEY_LAST_USED_UPDATE_INTERVAL_SECONDS:300}
      auth-cache-ttl-seconds: ${API_KEY_AUTH_CACHE_TTL_SECONDS:60}
  shortlink:
    code-length-min: 6
  redirect:
    cache-ttl-seconds: ${REDIRECT_CACHE_TTL_SECONDS:3600}
    default-status-code: ${REDIRECT_DEFAULT_STATUS_CODE:302} # 302 or 301
    not-found-cache-ttl-seconds: ${REDIRECT_NOT_FOUND_CACHE_TTL_SECONDS:60}
    not-found-landing-url: ${REDIRECT_NOT_FOUND_LANDING_URL:}
    gone-landing-url: ${REDIRECT_GONE_LANDING_URL:}
    query-forward-mode: ${REDIRECT_QUERY_FORWARD_MODE:}
    query-forward-allowlist: ${REDIRECT_QUERY_FORWARD_ALLOWLIST:}
    query-forward-reserved-params: ${REDIRECT_QUERY_FORWARD_RESERVED_PARAMS:}
  analytics:
    salt: ${ANALYTICS_SALT:dev-salt-change-me}
    redis-key-ttl-days: ${ANALYTICS_REDIS_TTL_DAYS:45}
    quota:
      fail-open: ${ANALYTICS_QUOTA_FAIL_OPEN:false}
      lookup-cache-ttl-seconds: ${ANALYTICS_QUOTA_LOOKUP_CACHE_TTL_SECONDS:30}
      lookup-cache-max-entries: ${ANALYTICS_QUOTA_LOOKUP_CACHE_MAX_ENTRIES:10000}
    # flush 回补窗口（最近 N 天，包含今天），用于部署中断后的追赶补齐
    flush-backfill-days: ${ANALYTICS_FLUSH_BACKFILL_DAYS:7}
    # 可选：追踪参数采集白名单（逗号分隔），为空时 Edge 采用安全默认值 utm_*,gclid,fbclid
    tracking-param-allowlist: ${ANALYTICS_TRACKING_PARAM_ALLOWLIST:}
    # 核心访问流（Redirect -> Redis Stream -> 异步 PV/UV 聚合），默认启用；不受 events.enabled/sample-rate 影响
    visit-stream:
      # 空值时兼容回退到 events.stream-max-len；启动校验要求容量覆盖峰值恢复预算。
      max-len: ${ANALYTICS_VISIT_STREAM_MAX_LEN:}
      peak-events-per-second: ${ANALYTICS_VISIT_STREAM_PEAK_EVENTS_PER_SECOND:1000}
      recovery-window-seconds: ${ANALYTICS_VISIT_STREAM_RECOVERY_WINDOW_SECONDS:180}
      safety-margin-percent: ${ANALYTICS_VISIT_STREAM_SAFETY_MARGIN_PERCENT:10}
    dirty-marker:
      # 新 producer 默认仅推进 V2 generation marker；回滚窗口可临时恢复 additive legacy 写入。
      legacy-write-enabled: ${ANALYTICS_DIRTY_MARKER_LEGACY_WRITE_ENABLED:false}
      # 完成全量旧实例停写、排空和 compatibility TTL 之前必须保持开启。
      legacy-read-enabled: ${ANALYTICS_DIRTY_MARKER_LEGACY_READ_ENABLED:true}
      legacy-retirement-confirmed: ${ANALYTICS_DIRTY_MARKER_LEGACY_RETIREMENT_CONFIRMED:false}
      compatibility-ttl-days: ${ANALYTICS_DIRTY_MARKER_COMPATIBILITY_TTL_DAYS:45}
      legacy-write-stopped-at: ${ANALYTICS_DIRTY_MARKER_LEGACY_WRITE_STOPPED_AT:}
      legacy-drained-at: ${ANALYTICS_DIRTY_MARKER_LEGACY_DRAINED_AT:}
    dimensions:
      enabled: ${ANALYTICS_DIMENSIONS_ENABLED:false}
      types: ${ANALYTICS_DIMENSIONS_TYPES:}
    events:
      # 可选访问明细落库（Redis Stream -> MySQL link_visit_events），默认关闭；不影响基础 PV/UV
      enabled: ${ANALYTICS_EVENTS_ENABLED:false}
      # 仅影响访问明细落库采样；不影响基础 PV/UV 或应用月点击配额
      sample-rate: ${ANALYTICS_EVENTS_SAMPLE_RATE:0.1}
      # 兼容旧配置：当 visit-stream.max-len 为空时作为核心访问流 trim fallback
      stream-max-len: ${ANALYTICS_EVENTS_STREAM_MAX_LEN:200000}
      retention-days: ${ANALYTICS_EVENTS_RETENTION_DAYS:14}
      # consumer 稳定化：多实例部署建议每个实例不同且稳定（可选）
      consumer-name: ${ANALYTICS_EVENTS_CONSUMER_NAME:}
      # pending 治理：接管闲置 pending（避免 consumer 漂移/下线导致长期积压）
      pending-reclaim-enabled: ${ANALYTICS_EVENTS_PENDING_RECLAIM_ENABLED:true}
      pending-reclaim-min-idle-ms: ${ANALYTICS_EVENTS_PENDING_RECLAIM_MIN_IDLE_MS:60000}
      pending-reclaim-count: ${ANALYTICS_EVENTS_PENDING_RECLAIM_COUNT:200}
      ingest-batch-size: ${ANALYTICS_EVENTS_INGEST_BATCH_SIZE:200}
      ingest-max-batches: ${ANALYTICS_EVENTS_INGEST_MAX_BATCHES:10}
      ingest-time-budget-ms: ${ANALYTICS_EVENTS_INGEST_TIME_BUDGET_MS:1000}
      fail-open: ${ANALYTICS_EVENTS_FAIL_OPEN:true}
  edge:
    # 可信代理链（CIDR 列表）：仅当 remoteAddr 命中该列表时，才采信 X-Real-IP / X-Forwarded-For 等头部
    trusted-proxies: ${EDGE_TRUSTED_PROXIES:}
    risk-control:
      enabled: ${EDGE_RISK_ENABLED:false}
      ip-allowlist: ${EDGE_RISK_IP_ALLOWLIST:}
      ip-denylist: ${EDGE_RISK_IP_DENYLIST:}
      rate-limit:
        enabled: ${EDGE_RISK_RATE_LIMIT_ENABLED:false}
        window-seconds: ${EDGE_RISK_RATE_LIMIT_WINDOW_SECONDS:60}
        ip-max-requests: ${EDGE_RISK_RATE_LIMIT_IP_MAX:120}
        ip-code-enabled: ${EDGE_RISK_RATE_LIMIT_IP_CODE_ENABLED:false}
        ip-code-max-requests: ${EDGE_RISK_RATE_LIMIT_IP_CODE_MAX:60}
        fail-open: ${EDGE_RISK_RATE_LIMIT_FAIL_OPEN:true}
      bot:
        enabled: ${EDGE_RISK_BOT_ENABLED:false}
        user-agent-keywords: ${EDGE_RISK_BOT_UA_KEYWORDS:bot,crawler,spider,curl,wget,python-requests,httpclient}
        ip-max-requests: ${EDGE_RISK_BOT_IP_MAX:30}
        block: ${EDGE_RISK_BOT_BLOCK:false}

logging:
  level:
    root: INFO
